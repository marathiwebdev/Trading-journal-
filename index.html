<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trade Journal — P/L & Pips Tracker</title>
<style>
:root{
  --maxw:1100px;
  --accent:#1f6feb;
  --muted:#666;
  --card:#fff;
  --bg:#f4f7fb;
}
*{box-sizing:border-box;font-family:Inter, Arial, sans-serif}
body{margin:0;background:var(--bg);color:#111;display:flex;justify-content:center;padding:24px}
.app{width:100%;max-width:var(--maxw)}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
h1{margin:0;font-size:20px}
.card{background:var(--card);padding:16px;border-radius:8px;box-shadow:0 2px 8px rgba(20,30,60,0.06);margin-bottom:12px}
.auth-row{display:flex;gap:8px;align-items:center}
input,select,textarea{padding:8px;border:1px solid #ddd;border-radius:6px;width:100%}
label{font-size:13px;color:var(--muted);display:block;margin-bottom:6px}
.grid{display:grid;gap:8px}
.grid-2{grid-template-columns:1fr 1fr}
button{background:var(--accent);color:#fff;border:0;padding:8px 12px;border-radius:6px;cursor:pointer}
button.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px}
th,td{padding:8px;border-bottom:1px solid #eee;text-align:left}
.small{font-size:12px;color:var(--muted)}
.muted{color:var(--muted)}
.summary{display:flex;gap:12px;flex-wrap:wrap}
.summary .s{padding:10px;border-radius:8px;background:#fff;min-width:160px}
.filters{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:700px){
  .grid-2{grid-template-columns:1fr}
  header{flex-direction:column;align-items:flex-start;gap:8px}
}
</style>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
<div class="app">
  <header>
    <h1>Trade Journal — P/L & Pips Tracker</h1>
    <div class="auth-card card">
      <div id="auth-unsigned" class="auth-row">
        <input id="email" type="email" placeholder="Email" style="width:200px">
        <input id="password" type="password" placeholder="Password" style="width:150px">
        <button id="btn-signup">Sign up</button>
        <button id="btn-login" class="ghost">Login</button>
      </div>
      <div id="auth-signed" class="auth-row" style="display:none">
        <div class="small muted" id="who"></div>
        <button id="btn-logout" class="ghost">Logout</button>
      </div>
    </div>
  </header>

  <section class="card">
    <h3 style="margin-top:0">Add / Edit Trade</h3>
    <div id="form-area">
      <div class="grid grid-2" style="gap:10px">
        <div>
          <label>Date & Time</label>
          <input id="trade-dt" type="datetime-local">
        </div>
        <div>
          <label>Pair / Instrument</label>
          <select id="pair"><option value="">-- Select Pair --</option>
            <option>EURUSD</option><option>GBPUSD</option><option>USDJPY</option><option>USDCHF</option><option>USDCAD</option>
            <option>AUDUSD</option><option>NZDUSD</option><option>EURGBP</option><option>EURJPY</option><option>EURCHF</option>
            <option>EURCAD</option><option>EURAUD</option><option>EURNZD</option><option>GBPJPY</option><option>GBPCHF</option>
            <option>GBPCAD</option><option>GBPAUD</option><option>GBPNZD</option><option>CADJPY</option><option>CHFJPY</option>
            <option>AUDJPY</option><option>AUDNZD</option><option>AUDCAD</option><option>AUDCHF</option><option>NZDJPY</option>
            <option>NZDCAD</option><option>NZDCHF</option><option>XAUUSD</option><option>BTCUSD</option>
          </select>
        </div>
      </div>
      <div class="grid grid-2" style="margin-top:8px">
        <div><label>Entry Price</label><input id="entry" placeholder="Entry price (optional)"></div>
        <div><label>Exit Price</label><input id="exit" placeholder="Exit price (optional)"></div>
      </div>
      <div class="grid grid-2" style="margin-top:8px">
        <div><label>Pips Captured</label><input id="pips" type="number" placeholder="pips captured"></div>
        <div><label>Stop Loss (pips)</label><input id="slpips" type="number" placeholder="SL in pips"></div>
      </div>
      <div class="grid" style="margin-top:8px">
        <div><label>Profit / Loss</label><input id="pl" placeholder="Profit or Loss value"></div>
      </div>
      <div style="margin-top:8px">
        <label>Notes</label>
        <textarea id="notes" rows="3" placeholder="Notes"></textarea>
      </div>
      <div style="display:flex;gap:8px;margin-top:8px;align-items:center">
        <button id="save-record">Save record</button>
        <button id="clear-form" class="ghost">Clear</button>
        <div class="small muted" id="form-mode">Mode: Add</div>
      </div>
    </div>
  </section>

  <section class="card">
    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px">
      <div class="filters">
        <label class="small">Filter</label>
        <select id="filter-pair"><option value="">All pairs</option></select>
        <input id="filter-from" type="date">
        <input id="filter-to" type="date">
        <button id="apply-filter" class="ghost">Apply</button>
        <button id="reset-filter" class="ghost">Reset</button>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <button id="export-csv" class="ghost">Export CSV</button>
        <button id="delete-all" class="ghost">Delete all</button>
      </div>
    </div>
  </section>

  <section class="card">
    <h3 style="margin-top:0">Summary</h3>
    <div class="summary" id="summary">
      <div class="s"><div class="small muted">Total Trades</div><div id="tot-trades">0</div></div>
      <div class="s"><div class="small muted">Total Pips Captured</div><div id="tot-pips">0</div></div>
      <div class="s"><div class="small muted">Total SL</div><div id="tot-slpips">0</div></div>
      <div class="s"><div class="small muted">Net P/L</div><div id="tot-pl">0</div></div>
    </div>
  </section>

  <section class="card">
    <h3 style="margin-top:0">Last 7 Days Performance</h3>
    <div class="summary" id="last7-summary">
      <div class="s"><div class="small muted">Trades</div><div id="last7-trades">0</div></div>
      <div class="s"><div class="small muted">Pips Captured</div><div id="last7-pips">0</div></div>
      <div class="s"><div class="small muted">Total SL</div><div id="last7-sl">0</div></div>
      <div class="s"><div class="small muted">Net P/L</div><div id="last7-pl">0</div></div>
    </div>
  </section>

  <section class="card">
    <h3 style="margin-top:0">Records</h3>
    <div id="records-wrap">
      <table id="records-table">
        <thead>
          <tr>
            <th>Date</th><th>Pair</th><th>Pips</th><th>SL(pips)</th><th>P/L</th><th>Notes</th><th>Actions</th>
          </tr>
        </thead>
        <tbody id="records-body"></tbody>
      </table>
    </div>
  </section>

<footer style="font-size:12px;color:var(--muted);margin-top:8px">Trade journal app.</footer>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyA9eFUc13C4WOcxoqT-oM1sqDEli2YxxAg",
  authDomain: "trading-journal-2ed62.firebaseapp.com",
  databaseURL: "https://trading-journal-2ed62-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "trading-journal-2ed62",
  storageBucket: "trading-journal-2ed62.appspot.com",
  messagingSenderId: "436859301261",
  appId: "1:436859301261:web:5557306d54d4a3778c61c4",
  measurementId: "G-B61PTQLM6Y"
};
firebase.initializeApp(firebaseConfig);

let currentUser=null;
let dbRef=null;
let allRecords={};
let editId=null;

const emailEl=document.getElementById('email');
const passEl=document.getElementById('password');
const btnSignup=document.getElementById('btn-signup');
const btnLogin=document.getElementById('btn-login');
const btnLogout=document.getElementById('btn-logout');
const authUnsigned=document.getElementById('auth-unsigned');
const authSigned=document.getElementById('auth-signed');
const whoEl=document.getElementById('who');

const tradeDt=document.getElementById('trade-dt');
const pairEl=document.getElementById('pair');
const entryEl=document.getElementById('entry');
const exitEl=document.getElementById('exit');
const pipsEl=document.getElementById('pips');
const slpipsEl=document.getElementById('slpips');
const plEl=document.getElementById('pl');
const notesEl=document.getElementById('notes');
const saveBtn=document.getElementById('save-record');
const clearBtn=document.getElementById('clear-form');
const formMode=document.getElementById('form-mode');

const recordsBody=document.getElementById('records-body');
const totTradesEl=document.getElementById('tot-trades');
const totPipsEl=document.getElementById('tot-pips');
const totSLEl=document.getElementById('tot-slpips');
const totPlEl=document.getElementById('tot-pl');
const last7Trades=document.getElementById('last7-trades');
const last7Pips=document.getElementById('last7-pips');
const last7SL=document.getElementById('last7-sl');
const last7PL=document.getElementById('last7-pl');

function updateUI(){
  const records=Object.values(allRecords).sort((a,b)=>b.dt-a.dt);
  recordsBody.innerHTML='';
  let totTrades=0,totPips=0,totSL=0,totPL=0;
  let last7daysTrades=0,last7daysPips=0,last7daysSL=0,last7daysPL=0;
  const now=Date.now();
  const sevenDays=now-7*24*60*60*1000;
  records.forEach((r,id)=>{
    totTrades++;
    totPips+=Number(r.pips)||0;
    totSL+=Number(r.sl_pips)||0;
    totPL+=Number(r.pl)||0;
    if(r.dt>sevenDays){
      last7daysTrades++;
      last7daysPips+=Number(r.pips)||0;
      last7daysSL+=Number(r.sl_pips)||0;
      last7daysPL+=Number(r.pl)||0;
    }
    const tr=document.createElement('tr');
    tr.innerHTML=`<td>${new Date(r.dt).toLocaleString()}</td>
      <td>${r.pair}</td>
      <td>${r.pips||''}</td>
      <td>${r.sl_pips||''}</td>
      <td>${r.pl||''}</td>
      <td>${r.notes||''}</td>
      <td>
        <button onclick="editRecord('${id}')">Edit</button>
        <button onclick="deleteRecord('${id}')">Delete</button>
      </td>`;
    recordsBody.appendChild(tr);
  });
  totTradesEl.textContent=totTrades;
  totPipsEl.textContent=totPips;
  totSLEl.textContent=totSL;
  totPlEl.textContent=totPL;

  last7Trades.textContent=last7daysTrades;
  last7Pips.textContent=last7daysPips;
  last7SL.textContent=last7daysSL;
  last7PL.textContent=last7daysPL;
}

function editRecord(id){
  const r=allRecords[id];
  editId=id;
  tradeDt.value=new Date(r.dt).toISOString().slice(0,16);
  pairEl.value=r.pair;
  entryEl.value=r.entry||'';
  exitEl.value=r.exit||'';
  pipsEl.value=r.pips||'';
  slpipsEl.value=r.sl_pips||'';
  plEl.value=r.pl||'';
  notesEl.value=r.notes||'';
  formMode.textContent='Mode: Edit';
}

function deleteRecord(id){
  if(confirm('Delete this record?')){
    firebase.database().ref('users/'+currentUser.uid+'/records/'+id).remove();
  }
}

function resetForm(){
  editId=null;
  tradeDt.value='';
  pairEl.value='';
  entryEl.value='';
  exitEl.value='';
  pipsEl.value='';
  slpipsEl.value='';
  plEl.value='';
  notesEl.value='';
  formMode.textContent='Mode: Add';
}

clearBtn.addEventListener('click',resetForm);

saveBtn.addEventListener('click',()=>{
  if(!currentUser){alert('Login first');return;}
  if(!pairEl.value){alert('Select pair');return;}
  const data={
    dt:tradeDt.value?new Date(tradeDt.value).getTime():Date.now(),
    pair:pairEl.value,
    entry:entryEl.value||'',
    exit:exitEl.value||'',
    pips:Number(pipsEl.value)||0,
    sl_pips:Number(slpipsEl.value)||0,
    pl:Number(plEl.value)||0,
    notes:notesEl.value||''
  };
  const ref=firebase.database().ref('users/'+currentUser.uid+'/records');
  if(editId){
    ref.child(editId).set(data).then(resetForm);
  }else{
    ref.push(data).then(resetForm);
  }
});

// AUTH
btnSignup.addEventListener('click',()=>{
  if(!emailEl.value||!passEl.value){alert('Enter email & password');return;}
  firebase.auth().createUserWithEmailAndPassword(emailEl.value,passEl.value)
    .then(()=>alert('Account created — login now')).catch(e=>alert(e.message));
});
btnLogin.addEventListener('click',()=>{
  if(!emailEl.value||!passEl.value){alert('Enter email & password');return;}
  firebase.auth().signInWithEmailAndPassword(emailEl.value,passEl.value)
    .catch(e=>alert(e.message));
});
btnLogout.addEventListener('click',()=>firebase.auth().signOut());

firebase.auth().onAuthStateChanged(user=>{
  currentUser=user;
  if(user){
    authUnsigned.style.display='none';
    authSigned.style.display='flex';
    whoEl.textContent=user.email;
    dbRef=firebase.database().ref('users/'+currentUser.uid+'/records');
    dbRef.on('value',snap=>{
      allRecords=snap.val()||{};
      updateUI();
    });
  }else{
    authUnsigned.style.display='flex';
    authSigned.style.display='none';
    whoEl.textContent='';
    if(dbRef) dbRef.off();
    allRecords={};
    updateUI();
  }
});
</script>
</body>
</html>
